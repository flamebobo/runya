services:
  runew-app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - runew-data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - runew-app
    restart: unless-stopped

  runew-backup:
    image: alpine:3.21
    profiles: ['backup']
    command: ['sh', '-c', 'sleep infinity']
    volumes:
      - runew-data:/data
      - runew-backups:/backups
    restart: unless-stopped

volumes:
  runew-data:
  runew-backups:
